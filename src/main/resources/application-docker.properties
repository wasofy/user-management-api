# Docker profile: PostgreSQL container instead of local H2.
# Credentials come from environment variables (docker-compose reads them
# from .env); nothing sensitive lives in this file.
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# The H2 console is a dev-only tool and must not run in containers
spring.h2.console.enabled=false
