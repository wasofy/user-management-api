spring.application.name=usermanagement

# Tests use a throwaway in-memory H2 database instead of the file-based dev DB,
# so test data never pollutes ./data/ and every test run starts clean.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Mirror production Actuator exposure so tests verify the real surface
management.endpoints.web.exposure.include=health
