name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode verify

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        # CI is ephemeral, so the template credentials are good enough
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke test dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run smoke test
        run: python scripts/smoke_test.py --timeout 120

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  image-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t user-management-api .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: user-management-api
          format: table
          # Fail the pipeline on fixable high or critical CVEs
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
